[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievo"
version = "0.1.0"
description = "A local-first disk triage and file-recovery prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Retrievo contributors" }]
dependencies = []

[project.scripts]
retrievo = "retrievo.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
